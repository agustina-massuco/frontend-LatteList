<div class="px-2 pb-2" style="max-width: 380px; margin: 0 auto;">
  
  <h5 class="text-center mb-3" style="color: #4A2A1A; font-size: 0.95rem;">
    Ingresa tu email y te enviaremos un enlace.
  </h5>
  
  <div class="mb-3">
    <input 
      type="email" 
      [formControl]="emailControl" 
      placeholder="Ingresa tu email aquí..." 
      class="form-control"
      [class.is-invalid]="emailControl.invalid && (emailControl.dirty || emailControl.touched)"
    >
    
    @if (emailControl.invalid && (emailControl.dirty || emailControl.touched)) {
        <div class="text-danger small mt-1" style="font-size: 0.8rem;">
            Email inválido.
        </div>
    }
  </div>

  <div class="d-grid gap-2 mt-3">
    <button (click)="enviar()" [disabled]="emailControl.invalid || cargando" class="btn btn-primary">
      @if(cargando) { 
        <span class="spinner-border spinner-border-sm me-2"></span> Enviando... 
      } @else { 
        Enviar enlace 
      }
    </button>
    
    <button class="btn btn-outline-secondary btn-sm" (click)="cancelar()" style="border: none;">
      Cancelar
    </button>
  </div>
</div>
