<header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
           <span class="navbar-brand">
    <img src="/images/logo.svg" alt="Logo de LatteList">
    
    LatteList
</span>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto"> @if (!authSer.isLoggedIn()) {
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/auth/login" routerLinkActive="active">Iniciar sesión</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="auth/registrarse" routerLinkActive="active">Crear cuenta</a>
                    </li>
                    } @else {
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/home" routerLinkActive="active">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/cafes" routerLinkActive="active">Cafés</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/usuarios/perfil" routerLinkActive="active">Mi perfil</a>
                    </li>

                    @if (authSer.isAdmin()) {
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/usuarios/listado" routerLinkActive="active">Usuarios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/usuarios/registrarAdmin" routerLinkActive="active">Crear Admin</a>
                    </li>
                    } @else {
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/lista" routerLinkActive="active">Mis listas</a>
                    </li>
                    }
                    <li class="nav-item logout-item">
                        <button class="btn btn-outline-danger" (click)="onLogout()">Cerrar sesión</button>
                    </li>
                    }
                </ul>
            </div>
        </div>
    </nav>
</header>
