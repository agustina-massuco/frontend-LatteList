@if (isOpen) {
  <div class="modal-overlay" (click)="onOverlayClick($event)">
    <div class="modal-content" [class.drawer]="isMobile()" [class.modal]="!isMobile()">
      <div class="modal-header">
        <h2>{{ title }}</h2>
        <button class="close-button" (click)="onClose()" aria-label="Cerrar">&times;</button>
      </div>
      <div class="modal-body">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
